name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          # Project sites are served from /<repo>/; set BASE_PATH to "/" for a custom domain.
          BASE_PATH: /${{ github.event.repository.name }}/
          DELIVERY_SALT: ${{ secrets.DELIVERY_SALT }}
          VITE_QR_IMAGE: ${{ vars.QR_IMAGE }}
          VITE_SUPPORT_EMAIL: ${{ vars.SUPPORT_EMAIL }}
          VITE_FORM_PROVIDER: ${{ vars.FORM_PROVIDER }}
          VITE_FORM_ACCESS_KEY: ${{ vars.FORM_ACCESS_KEY }}
          VITE_RECEIPT_UPLOADS: ${{ vars.RECEIPT_UPLOADS }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
